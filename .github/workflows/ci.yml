name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SUI_VERSION: testnet-v1.81.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        run: |
          mkdir -p "$RUNNER_TEMP/sui"
          curl -sfL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz" | tar -xz -C "$RUNNER_TEMP/sui" ./sui
          echo "$RUNNER_TEMP/sui" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sui/sui" --version
      - run: sui move test -e testnet
        working-directory: contracts/blockpay
